<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1eb2a6" />
    <meta name="description" content="DishaYaaN helps students of Class 6–12 explore emerging technology, prepare for JEE, NEET, NDA, CS and CMA, and build real projects with human mentors. Your future is bigger than your syllabus." />
    <meta name="keywords" content="student mentorship India, career guidance Class 6-12, robotics for students, drone technology course, AI and machine learning for school students, stock market for students, JEE guidance, NEET guidance, NDA preparation" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>DishaYaaN — mentorship, technology and career guidance for Class 6–12</title>

  </head>
  <body>
    <noscript>DishaYaaN needs JavaScript enabled.</noscript>
    <div id="root"></div>
    <!-- Netlify Forms registration (the React forms POST to "/" with these names) -->
    <form name="mentor-connect" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" />
      <input name="whatsapp" />
      <input name="class" />
      <input name="domain" />
      <input name="language" />
      <input name="availability" />
      <input name="context" />
    </form>
    <form name="home-demand" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" />
      <input name="whatsapp" />
      <input name="class" />
      <input name="domain" />
      <input name="context" />
    </form>
    <form name="plan-checkout" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="plan" />
      <input name="student" />
      <input name="whatsapp" />
      <input name="email" />
    </form>
    <form name="partner-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" />
      <input name="whatsapp" />
      <input name="institution" />
      <input name="requirement" />
    </form>
    <form name="book-session" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="role" />
      <input name="name" />
      <input name="whatsapp" />
      <input name="email" />
      <input name="domain" />
      <input name="mode" />
      <input name="mentor_seat" />
      <input name="context" />
      <input name="date" />
      <input name="slot" />
      <input name="reference" />
    </form>
  </body>
</html>
